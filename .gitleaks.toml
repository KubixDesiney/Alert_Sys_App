title = "SIAS - Smart Industrial Alert System gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Firebase client config files contain PUBLIC client API keys by design (restricted via GCP API key restrictions, not secrets). Exclude generated config files only - all other paths are still scanned."
paths = [
  '''(^|[\\/])lib[\\/]firebase_options\.dart$''',
  '''(^|[\\/])android[\\/]app[\\/]google-services\.json$''',
  '''(^|[\\/])ios[\\/]Runner[\\/]GoogleService-Info\.plist$''',
  '''(^|[\\/])macos[\\/]Runner[\\/]GoogleService-Info\.plist$''',
  '''(^|[\\/])web[\\/]firebase-messaging-sw\.js$''',
  # Browser-only Google Maps key used by the Flutter web shell. Keep this key
  # restricted to the production web origins in Google Cloud Console.
  '''(^|[\\/])web[\\/]index\.html$''',
  '''(^|[\\/])node_modules[\\/]''',
  '''(^|[\\/])build[\\/]''',
  '''(^|[\\/])coverage[\\/]''',
  '''(^|[\\/])\.dart_tool[\\/]''',
  '''(^|[\\/])deploy[\\/]onprem[\\/]worker-runner[\\/]vendor[\\/]''',
  '''(^|[\\/])\.env\.example$''',
]
regexes = [
  # Client-side localStorage namespace key in cloudflare_store_worker.js (Kubix Copilot
  # chat) — a browser storage key, not a credential. The generic-api-key rule matches it
  # only because the identifier is named STORAGE_KEY.
  '''kubix_copilot_v1''',
]
