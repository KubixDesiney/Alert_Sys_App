# Industrial telemetry ingestion + connector engine (SCADA / PLC / historian -> SIAS).
# Deploy:  npx wrangler deploy --config wrangler.ingest.toml
#
# main bundles ./cloudflare_ingest_connectors.js automatically (wrangler/esbuild).
#
# Secrets (npx wrangler secret put <NAME> --config wrangler.ingest.toml):
#   INGEST_SHARED_SECRET     optional — legacy/global gateways send it as x-alertsys-ingest
#   FIREBASE_SERVICE_ACCOUNT required for cloud-pull, /verify, and the connector vault —
#                            the service-account JSON (same value as the AI/GitHub workers)
#   WORKER_SHARED_SECRET     server-to-server + CI bearer — never compiled into a build
#   CLIENT_WORKER_KEY        low-privilege bearer the app sends on /verify + /control;
#                            public by design (it ships in web/APK builds), so it must
#                            differ from WORKER_SHARED_SECRET and open nothing else
#   FB_DB_URL                required - this instance's RTDB base URL
#   NOTIFY_WORKER_URL        required - this instance's notify-worker /notify endpoint
#
# FB_DB_URL / NOTIFY_WORKER_URL are secrets, not [vars]: [vars] override secrets of the
# same name, so a placeholder here silently wins over a correctly-set secret and the
# cron then talks to a host that does not exist. The per-minute cron
# polls every due cloud-pull connector and refreshes MQTT link status.

name = "alertsys-ingest"
main = "cloudflare_ingest_worker.js"
compatibility_date = "2024-11-01"

[triggers]
crons = ["* * * * *"]

[vars]
INGEST_RATE_PER_MIN = "240"
INGEST_DEDUP_WINDOW_MS = "60000"
