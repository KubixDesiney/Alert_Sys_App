name = "alert-notifier"
main = "cloudflare_ai_worker.js"
compatibility_date = "2025-01-01"

[ai]
binding = "AI"

[triggers]
crons = ["* * * * *"]

[vars]
# Caller auth for HTTP endpoints (/config stays public for status probes):
#   off      — no check (legacy)
#   log      — verify Firebase ID token / shared secret, log offenders, allow
#   required — 401 without a valid ID token or the shared secret
# Enforced: unauthenticated callers are rejected. The client sends the signed-in
# user's Firebase ID token (WorkerAuth.headers); CI/worker-to-worker calls use
# ALERTSYS_WORKER_SHARED_SECRET. Keep the secret out of untrusted contexts and
# rotate it if it ever shipped in a public build.
WORKER_AUTH_MODE = "required"
