name = "alert-notifier"
main = "cloudflare_ai_worker.js"
compatibility_date = "2025-01-01"

[ai]
binding = "AI"

[triggers]
crons = ["* * * * *"]

[vars]
# Caller auth for HTTP endpoints (/config stays public for status probes):
#   off      — no check (legacy)
#   log      — verify Firebase ID token / shared secret, log offenders, allow
#   required — 401 without a valid ID token or the shared secret
# Flip to "required" once the installed client fleet sends ID tokens, then
# drop ALERTSYS_WORKER_SHARED_SECRET from app builds (keep it for CI/worker-
# to-worker calls only).
WORKER_AUTH_MODE = "log"
