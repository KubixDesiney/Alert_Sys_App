name: alertsysapp
description: A new Flutter project.

publish_to: "none"

version: 1.2.1

environment:
  sdk: ">=3.10.3 <4.0.0"
  flutter: ">=3.38.4"

dependencies:
  rxdart: ^0.27.7
  share_plus: ^10.1.0
  path_provider: ^2.1.5
  file_saver: ^0.2.0   # optional, but simplifies web saves
  printing: ^5.13.2
  pdf: ^3.11.3
  universal_html: ^2.2.4
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^18.0.1
  shorebird_code_push: ^1.0.0
  vibration: ^3.2.0
  google_generative_ai: ^0.4.3
  device_info_plus: ^11.0.0
  http: ^1.3.0
  csv: ^6.0.0
  excel: ^4.0.0
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.0

  # Voice command stack:
  #   - speech_to_text wraps the platform recognizer for fast Android capture
  #     and keeps web push-to-talk testable from the dashboard.
  #   - Voice enrollment remains mandatory on Android before commands run.
  #   - flutter_tts speaks the exact command result for factory floors.
  speech_to_text: 7.3.0
  flutter_tts: ^4.2.0
  permission_handler: ^11.3.1

  # Station scan camera for QR-based workstation lookup and alert history.
  mobile_scanner: ^6.0.11

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Connectivity (Phase 5)
  connectivity_plus: ^6.0.5

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_database: 12.1.3

  # UI helpers
  cupertino_icons: ^1.0.8
  fl_chart: ^0.70.0
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.3.0
  provider: ^6.1.2
  shimmer: ^3.0.0
  tflite_flutter: ^0.12.1
  qr_flutter: ^4.1.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.0
  geocoding: ^4.0.0
  file_picker: ^11.0.2
  syncfusion_flutter_pdf: ^33.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - shorebird.yaml
    - assets/models/conformer_tisid_small.tflite
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSans-Italic.ttf
    - assets/fonts/NotoSans-BoldItalic.ttf
    - assets/fonts/NotoSansArabic-Regular.ttf
    - media/shift_agent_logo.png
    - media/briefing_agent_logo.png
    - media/assist_agent_logo.png
    - media/predective_agent_logo.png
    - media/guardian_agent_logo.png
