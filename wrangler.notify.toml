name = "alertsys"
main = "cloudflare_notify_worker.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["* * * * *"]

[vars]
# Caller auth for HTTP endpoints (/config stays public for status probes).
# off | log | required — see wrangler.ai.toml. Enforced: unauthenticated callers
# are rejected. Producers send a Firebase ID token (or the shared secret for
# worker-to-worker triggers).
WORKER_AUTH_MODE = "required"
