# Serverless daily RTDB backup worker → Cloudflare R2.
# Deploy:  npx wrangler deploy --config wrangler.backup.toml
name = "alertsys-backup"
main = "cloudflare_backup_worker.js"
compatibility_date = "2025-01-01"

# Object storage for the snapshots. Create this bucket first:
#   npx wrangler r2 bucket create alertsys-backups
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "alertsys-backups"

# Daily at 02:00 UTC. Change as needed (https://crontab.guru).
[triggers]
crons = ["0 2 * * *"]

[vars]
BACKUP_KEEP = "30"
# Alert retention policy: terminal alerts (validee/cancelled) older than this
# many days are archived to R2 (alerts_archive/) and removed from RTDB after
# each successful backup, at most RETENTION_BATCH per daily run. This keeps the
# alerts table bounded for the every-minute worker crons. "0" disables.
# 365 keeps a full seasonal year live, comfortably above the predictive
# model's 180-day window and the forecaster's training lookback.
RETENTION_DAYS = "365"
RETENTION_BATCH = "500"

# Secrets (set with `wrangler secret put NAME --config wrangler.backup.toml`):
#   FIREBASE_SERVICE_ACCOUNT   the service-account JSON (full admin to export)
#   FB_DB_URL                  https://<project>-default-rtdb.firebaseio.com/
#   WORKER_SHARED_SECRET       required to use the manual /backup + /retention
#                              triggers; when unset those routes fail closed (403).
#                              The daily cron backup runs regardless of this secret.
