name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.6'
  NODE_VERSION: '22'

jobs:
  flutter:
    name: Flutter (analyze, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build Android APK (debug)
        run: flutter build apk --debug --dart-define=ALERTSYS_AI_WORKER_URL=https://alert-notifier.aziz-nagati01.workers.dev --dart-define=ALERTSYS_NOTIFY_WORKER_URL=https://alertsys.aziz-nagati01.workers.dev --dart-define=ALERTSYS_GITHUB_WORKER_URL=https://alertsys-guardian-proxy.pages.dev/github-proxy

      - name: Build Web release
        run: flutter build web --release --no-wasm-dry-run --dart-define=ALERTSYS_AI_WORKER_URL=https://alert-notifier.aziz-nagati01.workers.dev --dart-define=ALERTSYS_NOTIFY_WORKER_URL=https://alertsys.aziz-nagati01.workers.dev --dart-define=ALERTSYS_GITHUB_WORKER_URL=https://alertsys-guardian-proxy.pages.dev/github-proxy

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          if-no-files-found: error
          retention-days: 7

      # The shared sias-app worker serves this build/web bundle to every tenant
      # at <tenant>.kubixdesiney.com (see CLAUDE.md "Per-Tenant App Delivery").
      # It deploys HERE (not the worker job) because the assets directory must
      # exist. Gated behind the ENABLE_APP_WORKER_DEPLOY repo variable so CI
      # stays green until the TENANTS KV id (wrangler.app.toml) and the
      # *.kubixdesiney.com DNS wildcard are in place.
      - name: Deploy sias-app worker (protected main pushes, once configured)
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.ENABLE_APP_WORKER_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.app.toml

  worker:
    name: Cloudflare Workers (Jest + deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run worker and rules tests
        run: npm test

      # All 8 workers deploy from CI so nothing drifts from what's in git.
      # (Hand-deploying a subset guarantees config drift on exactly the
      # components buyers audit first: ingest, SCIM, monitoring, backups.)
      - name: Deploy workers (protected main pushes only)
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config wrangler.ai.toml
          npx wrangler deploy --config wrangler.notify.toml
          npx wrangler deploy --config wrangler.github.toml
          npx wrangler deploy --config wrangler.ingest.toml
          npx wrangler deploy --config wrangler.scim.toml
          npx wrangler deploy --config wrangler.monitor.toml
          npx wrangler deploy --config wrangler.backup.toml
          npx wrangler deploy --config wrangler.store.toml

      # Idempotent: re-running `wrangler secret put` with the same value is a no-op
      # other than a redeploy. The actual GitHub PAT lives only in the RTDB vault
      # (ai_agent_secrets/guardian/githubToken) — this worker just needs creds to
      # read that vault, so we never have to put the PAT itself in this workflow.
      - name: Set github worker secrets (protected main pushes only)
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          FB_DB_URL: ${{ vars.FB_DB_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALERTAPPSYS }}
        run: |
          set -euo pipefail
          put() { if [ -n "$2" ]; then printf '%s' "$2" | npx wrangler secret put "$1" --config wrangler.github.toml >/dev/null && echo "  set $1"; fi; }
          put WORKER_SHARED_SECRET "$WORKER_SHARED_SECRET"
          put FB_DB_URL "$FB_DB_URL"
          put FIREBASE_SERVICE_ACCOUNT "$FIREBASE_SERVICE_ACCOUNT"

  # Non-blocking by design: the legal drafts carry [[PLACEHOLDER]] markers until
  # counsel resolves them, and that must never gate a code deploy. Naming and
  # forbidden-claim violations still surface loudly in the job log.
  legal-lint:
    name: Legal pack lint (warning-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Lint docs/legal consistency
        run: node tool/legal_lint.mjs
