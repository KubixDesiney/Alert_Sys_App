name: Autonomous Bug Fix Agent

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run the fix loop even if health checks do not detect an issue'
        required: false
        default: 'false'
      dry_run:
        description: 'Collect health/context only; do not call models or edit files'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: autonomous-bugfix-agent
  cancel-in-progress: false

jobs:
  agent:
    name: Health, fix, review, open PR
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLUTTER_VERSION: '3.41.6'
      NODE_VERSION: '22'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_FIX_MODEL: ${{ vars.CLAUDE_FIX_MODEL || 'claude-opus-4-8' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'o3' }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALERTAPPSYS }}
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL || 'https://alertappsys-default-rtdb.firebaseio.com' }}
      WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
      AGENT_UI_HEALTH_URLS: ${{ vars.AGENT_UI_HEALTH_URLS || 'https://alertappsys.web.app' }}
      AGENT_AI_WORKER_URL: ${{ vars.AGENT_AI_WORKER_URL || 'https://alert-notifier.aziz-nagati01.workers.dev' }}
      AGENT_NOTIFY_WORKER_URL: ${{ vars.AGENT_NOTIFY_WORKER_URL || 'https://alertsys.aziz-nagati01.workers.dev' }}
      AGENT_PUBLISH_MODE: pull_request
      AGENT_SKIP_WEB_DEPLOY: '1'
      AGENT_DEPLOY_WORKERS: '0'
      AGENT_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
      AGENT_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
      AGENT_DETECTION_COMMANDS: |
        npm test
      AGENT_VALIDATION_COMMANDS: |
        npm test
        flutter analyze --no-fatal-infos --no-fatal-warnings
        flutter test --reporter expanded
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run autonomous bug-fix agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run agent:bugfix

      - name: Upload agent artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-bugfix-agent
          path: .dart_tool/autofix-agent
          if-no-files-found: ignore
          retention-days: 14

