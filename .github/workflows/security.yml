name: security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Secret scan - current tree (blocking)
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: Secret scan - full history legacy evidence
        run: |
          set +e
          gitleaks detect --config .gitleaks.toml --redact --no-banner --report-path gitleaks-history.json --exit-code 1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Legacy secret history remains::Full-history scan found historical findings. Current-tree scanning is blocking; history purge status and owner action are documented in docs/SECRET_ROTATION.md."
          fi
      - name: Upload history scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-report
          path: gitleaks-history.json
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install root packages
        run: npm ci
      - name: Audit root production packages
        run: npm audit --omit=dev --audit-level=high
      - name: Install functions packages
        working-directory: functions
        run: npm ci
      - name: Audit functions packages
        working-directory: functions
        run: npm audit --audit-level=high
      - name: Install codebasedelta packages
        working-directory: codebasedelta
        run: npm ci
      - name: Audit codebasedelta packages
        working-directory: codebasedelta
        run: npm audit --audit-level=high

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install root packages
        run: npm ci
      - name: Generate CycloneDX SBOM (production deps)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
