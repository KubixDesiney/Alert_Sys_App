name: security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Secret scan - current tree (blocking)
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: Secret scan - full history (informational)
        run: gitleaks detect --config .gitleaks.toml --redact --no-banner --exit-code 0 || true

  dependency-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit root packages
        run: npm audit --audit-level=high || echo "::warning::root npm audit found high/critical advisories"
      - name: Audit functions packages
        run: cd functions && npm audit --audit-level=high || echo "::warning::functions npm audit found high/critical advisories"
