name: Deploy (staging)

# Staging is isolated from production. Runs on the `staging` branch or manual dispatch.
# Required repo secrets (Settings -> Environments -> staging):
#   STAGING_FIREBASE_TOKEN, STAGING_FIREBASE_PROJECT,
#   STAGING_AI_WORKER_URL, STAGING_NOTIFY_WORKER_URL
on:
  push:
    branches: [ staging ]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Build + deploy to staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
      - run: flutter pub get
      - name: Build web (staging worker URLs)
        run: flutter build web --release --no-wasm-dry-run --dart-define=ALERTSYS_AI_WORKER_URL=${{ secrets.STAGING_AI_WORKER_URL }} --dart-define=ALERTSYS_NOTIFY_WORKER_URL=${{ secrets.STAGING_NOTIFY_WORKER_URL }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy to staging Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.STAGING_FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project ${{ secrets.STAGING_FIREBASE_PROJECT }} --token "$FIREBASE_TOKEN"
