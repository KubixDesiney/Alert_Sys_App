name: Uptime (synthetic)

# Every 15 minutes, probe the deployed instance's worker endpoints and verify the
# cron health pulses are fresh. Backs SLI-4/5/6 in docs/ops/SLO.md. A failing run
# notifies repo watchers via GitHub's normal workflow-failure notifications.
#
# Configure (Settings → Secrets and variables → Actions):
#   Variables: ALERTSYS_AI_WORKER_URL, ALERTSYS_NOTIFY_WORKER_URL, FB_DB_URL
#   Secrets:   WORKER_SHARED_SECRET (optional), FB_DB_ACCESS_TOKEN (optional)
# If the variables are unset the checks self-skip (green), so this is safe to land
# before the instance is provisioned.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run smoke test
        env:
          ALERTSYS_AI_WORKER_URL: ${{ vars.ALERTSYS_AI_WORKER_URL }}
          ALERTSYS_NOTIFY_WORKER_URL: ${{ vars.ALERTSYS_NOTIFY_WORKER_URL }}
          FB_DB_URL: ${{ vars.FB_DB_URL }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          FB_DB_ACCESS_TOKEN: ${{ secrets.FB_DB_ACCESS_TOKEN }}
        run: node tool/smoke_test.mjs | tee "$GITHUB_STEP_SUMMARY"
