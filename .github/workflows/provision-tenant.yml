name: Provision tenant instance

# Manual-only, and double-gated: workflow_dispatch (a human click with typed
# inputs) + the "provisioning" GitHub environment, which must be configured
# with required reviewers — so a stray click can never create infrastructure.
# Secrets (Firebase service account, Cloudflare token, tenant secret bundle)
# come from that environment, not from repo-level secrets.

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant slug (lowercase, dashes — e.g. nsw-7k2f)"
        required: true
        type: string
      project_id:
        description: "GCP/Firebase project id for the tenant"
        required: true
        type: string
      workers_subdomain:
        description: "Cloudflare workers.dev subdomain (for verification URLs)"
        required: true
        type: string
      region:
        description: "RTDB region"
        required: false
        default: "europe-west1"
        type: string
      tenant_code:
        description: "Commercial tenant code (e.g. NSW#7K2F)"
        required: true
        type: string
      company:
        description: "Buyer company"
        required: true
        type: string
      plan:
        description: "starter or growth"
        required: true
        type: choice
        options: [starter, growth]
      pm_name:
        description: "Production Manager full name"
        required: true
        type: string
      pm_email:
        description: "Production Manager email"
        required: true
        type: string
      supervisor_name:
        description: "Supervisor full name"
        required: true
        type: string
      supervisor_email:
        description: "Supervisor email"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provision-${{ inputs.tenant }}
  cancel-in-progress: false

jobs:
  provision:
    name: Provision + verify ${{ inputs.tenant }}
    runs-on: ubuntu-latest
    environment: provisioning
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install packages + CLIs
        run: |
          npm ci
          npm install -g firebase-tools@15.24.0 wrangler@4.114.0

      - name: Materialize tenant secrets (.env.tenant)
        env:
          TENANT_ENV_FILE: ${{ secrets.TENANT_ENV_FILE }}
        run: |
          set -euo pipefail
          if [ -z "$TENANT_ENV_FILE" ]; then
            echo "::error::The 'provisioning' environment must define TENANT_ENV_FILE (the filled .env.tenant contents)."
            exit 1
          fi
          mkdir -p "deploy/tenants/${{ inputs.tenant }}"
          printf '%s' "$TENANT_ENV_FILE" > "deploy/tenants/${{ inputs.tenant }}/.env.tenant"

      - name: Provision instance (execute)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          N8N_ACTIVATION_WEBHOOK_URL: ${{ secrets.N8N_ACTIVATION_WEBHOOK_URL }}
          N8N_ACTIVATION_WEBHOOK_AUTH: ${{ secrets.N8N_ACTIVATION_WEBHOOK_AUTH }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ inputs.workers_subdomain }}
        run: |
          node tool/provision_instance.mjs \
            --tenant "${{ inputs.tenant }}" \
            --project-id "${{ inputs.project_id }}" \
            --region "${{ inputs.region }}" \
            --workers-subdomain "${{ inputs.workers_subdomain }}" \
            --tenant-code "${{ inputs.tenant_code }}" \
            --company "${{ inputs.company }}" \
            --plan "${{ inputs.plan }}" \
            --pm-name "${{ inputs.pm_name }}" \
            --pm-email "${{ inputs.pm_email }}" \
            --supervisor-name "${{ inputs.supervisor_name }}" \
            --supervisor-email "${{ inputs.supervisor_email }}" \
            --execute

      - name: Verify instance (standalone re-run)
        run: node tool/verify_instance.mjs --tenant "${{ inputs.tenant }}"

      - name: Upload provision summary (no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provision-summary-${{ inputs.tenant }}
          path: deploy/tenants/${{ inputs.tenant }}/provision-summary.json
          if-no-files-found: ignore
